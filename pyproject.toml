[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ev4-qc-workbench"
version = "0.1.0"
description = "Windows-first profile-isolated EV4 quality-control workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5",
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[project.scripts]
ev4-qc-workbench = "ev4_qc_workbench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ev4_qc_workbench.profiles.ce" = ["ce-profile.lock.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "windows: requires Windows/Tkinter or the exact CE checkout",
  "integration: requires EV4_CE_REPO",
]
