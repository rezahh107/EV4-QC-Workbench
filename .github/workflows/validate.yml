name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CE_REFERENCE_BRANCH: main
  CE_REQUIRED_SHA: bc4a901d82fcdbdb131e30058b399508262706c5
  CE_PRODUCER_SCHEMA_SHA256: c556bb9deeccdcafeb885a1c8b3dbd660e4e06f452b8ac3c7040d21377465fcc
  CE_STAGE_BUNDLE_SHA256: fc1ec6d3f7aecbabaeb0a3455d9eb42788779d2fa1531e8c7b2cb3bde706a886
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  platform-independent:
    runs-on: ubuntu-latest
    env:
      WORKBENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Workbench head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKBENCH_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Workbench head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKBENCH_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Configure LF-preserving dependency checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout current CE main reference
        uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Constructability-Engineer-Repo
          ref: ${{ env.CE_REFERENCE_BRANCH }}
          path: EV4-Constructability-Engineer-Repo
          fetch-depth: 0
          persist-credentials: false

      - name: Assert selected current-main exact CE dependency and immutable bytes
        shell: bash
        run: |
          set -euo pipefail
          ce="$GITHUB_WORKSPACE/EV4-Constructability-Engineer-Repo"
          test "$(git -C "$ce" rev-parse HEAD)" = "$CE_REQUIRED_SHA"
          test "$(git -C "$ce" branch --show-current)" = "$CE_REFERENCE_BRANCH"
          test "$(git -C "$ce" remote get-url origin)" = "https://github.com/rezahh107/EV4-Constructability-Engineer-Repo"
          test "$(sha256sum "$ce/contracts/project-gate/producer-gate-export.v1.schema.json" | cut -d' ' -f1)" = "$CE_PRODUCER_SCHEMA_SHA256"
          test "$(sha256sum "$ce/contracts/project-gate/stage-bundle.v1.schema.json" | cut -d' ' -f1)" = "$CE_STAGE_BUNDLE_SHA256"
          git -C "$ce" diff --quiet HEAD --
          git -C "$ce" diff --cached --quiet
          echo "EV4_CE_REPO=$ce" >> "$GITHUB_ENV"

      - name: Capture CE read-only baseline
        shell: bash
        run: |
          set -euo pipefail
          ce="$GITHUB_WORKSPACE/EV4-Constructability-Engineer-Repo"
          git -C "$ce" rev-parse HEAD > "$RUNNER_TEMP/ce-head.before"
          git -C "$ce" status --porcelain=v1 --untracked-files=all --ignored=matching > "$RUNNER_TEMP/ce-status.before"
          git -C "$ce" ls-files -s > "$RUNNER_TEMP/ce-index.before"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked Workbench environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Compile production and tests
        run: python -m compileall -q src tests

      - name: Run platform-independent boundary, lock, transport, and import tests
        run: |
          pytest -q \
            tests/test_ce_preflight.py \
            tests/test_ce_profile_lock.py \
            tests/test_process_transport.py \
            tests/test_parent_import_boundary.py \
            tests/test_attempts.py \
            tests/test_strict_json.py \
            tests/test_profile_registry.py

      - name: Prove fresh isolated child and exact CE origins on Linux
        run: pytest -q -m integration tests/test_ce_connection_integration.py

      - name: Verify CE unchanged after Linux connection operations
        shell: bash
        run: |
          set -euo pipefail
          ce="$EV4_CE_REPO"
          git -C "$ce" rev-parse HEAD > "$RUNNER_TEMP/ce-head.after-connection"
          git -C "$ce" status --porcelain=v1 --untracked-files=all --ignored=matching > "$RUNNER_TEMP/ce-status.after-connection"
          git -C "$ce" ls-files -s > "$RUNNER_TEMP/ce-index.after-connection"
          cmp "$RUNNER_TEMP/ce-head.before" "$RUNNER_TEMP/ce-head.after-connection"
          cmp "$RUNNER_TEMP/ce-status.before" "$RUNNER_TEMP/ce-status.after-connection"
          cmp "$RUNNER_TEMP/ce-index.before" "$RUNNER_TEMP/ce-index.after-connection"

      - name: Run official CE authorized blocked invalid and prewrite integration on Linux
        run: pytest -q -m integration tests/test_ce_export_integration.py

      - name: Verify CE unchanged after Linux export operations
        shell: bash
        run: |
          set -euo pipefail
          ce="$EV4_CE_REPO"
          git -C "$ce" rev-parse HEAD > "$RUNNER_TEMP/ce-head.after-export"
          git -C "$ce" status --porcelain=v1 --untracked-files=all --ignored=matching > "$RUNNER_TEMP/ce-status.after-export"
          git -C "$ce" ls-files -s > "$RUNNER_TEMP/ce-index.after-export"
          cmp "$RUNNER_TEMP/ce-head.before" "$RUNNER_TEMP/ce-head.after-export"
          cmp "$RUNNER_TEMP/ce-status.before" "$RUNNER_TEMP/ce-status.after-export"
          cmp "$RUNNER_TEMP/ce-index.before" "$RUNNER_TEMP/ce-index.after-export"

      - name: Run platform-independent Workbench regression suite
        run: pytest -q

      - name: Verify final Linux CE state and patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          ce="$EV4_CE_REPO"
          git -C "$ce" rev-parse HEAD > "$RUNNER_TEMP/ce-head.final"
          git -C "$ce" status --porcelain=v1 --untracked-files=all --ignored=matching > "$RUNNER_TEMP/ce-status.final"
          git -C "$ce" ls-files -s > "$RUNNER_TEMP/ce-index.final"
          cmp "$RUNNER_TEMP/ce-head.before" "$RUNNER_TEMP/ce-head.final"
          cmp "$RUNNER_TEMP/ce-status.before" "$RUNNER_TEMP/ce-status.final"
          cmp "$RUNNER_TEMP/ce-index.before" "$RUNNER_TEMP/ce-index.final"
          git diff --check

  windows-exact-head:
    runs-on: windows-latest
    env:
      WORKBENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact Workbench head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKBENCH_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact Workbench head
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:WORKBENCH_HEAD_SHA) { throw "Workbench exact-head mismatch" }
          if ((git status --porcelain) -ne $null) { throw "Workbench checkout is not clean" }

      - name: Configure LF-preserving dependency checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout current CE main reference
        uses: actions/checkout@v4
        with:
          repository: rezahh107/EV4-Constructability-Engineer-Repo
          ref: ${{ env.CE_REFERENCE_BRANCH }}
          path: EV4-Constructability-Engineer-Repo
          fetch-depth: 0
          persist-credentials: false

      - name: Assert selected current-main exact CE dependency and immutable bytes
        shell: pwsh
        run: |
          $ce = Join-Path $env:GITHUB_WORKSPACE "EV4-Constructability-Engineer-Repo"
          if ((git -C $ce rev-parse HEAD) -ne $env:CE_REQUIRED_SHA) { throw "CE current-main evidence lock invalidated" }
          if ((git -C $ce branch --show-current) -ne $env:CE_REFERENCE_BRANCH) { throw "CE reference branch mismatch" }
          if ((git -C $ce remote get-url origin) -ne "https://github.com/rezahh107/EV4-Constructability-Engineer-Repo") { throw "CE remote mismatch" }
          $producer = (Get-FileHash -Algorithm SHA256 (Join-Path $ce "contracts/project-gate/producer-gate-export.v1.schema.json")).Hash.ToLowerInvariant()
          $bundle = (Get-FileHash -Algorithm SHA256 (Join-Path $ce "contracts/project-gate/stage-bundle.v1.schema.json")).Hash.ToLowerInvariant()
          if ($producer -ne $env:CE_PRODUCER_SCHEMA_SHA256) { throw "CE Producer Gate contract bytes mismatch" }
          if ($bundle -ne $env:CE_STAGE_BUNDLE_SHA256) { throw "CE Stage Bundle contract bytes mismatch" }
          git -C $ce diff --quiet HEAD --
          if ($LASTEXITCODE -ne 0) { throw "CE tracked working tree is dirty" }
          git -C $ce diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { throw "CE index is dirty" }
          "EV4_CE_REPO=$ce" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Capture CE read-only baseline
        shell: pwsh
        run: |
          $ce = $env:EV4_CE_REPO
          [ordered]@{
            head = (git -C $ce rev-parse HEAD)
            status = @(git -C $ce status --porcelain=v1 --untracked-files=all --ignored=matching)
            index = @(git -C $ce ls-files -s)
          } | ConvertTo-Json -Compress | Set-Content -NoNewline (Join-Path $env:RUNNER_TEMP "ce-before.json")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked Workbench environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Compile production and tests
        run: python -m compileall -q src tests

      - name: Run Profile lock preflight registry transport snapshot and import-boundary tests
        run: |
          pytest -q tests/test_ce_preflight.py tests/test_profile_registry.py tests/test_ce_profile_lock.py tests/test_strict_json.py tests/test_process_transport.py tests/test_attempts.py tests/test_parent_import_boundary.py

      - name: Run exact CE connection and fresh isolated interpreter integration
        run: pytest -q -m integration tests/test_ce_connection_integration.py

      - name: Verify CE unchanged after connection operations
        shell: pwsh
        run: |
          $ce = $env:EV4_CE_REPO
          $current = [ordered]@{
            head = (git -C $ce rev-parse HEAD)
            status = @(git -C $ce status --porcelain=v1 --untracked-files=all --ignored=matching)
            index = @(git -C $ce ls-files -s)
          } | ConvertTo-Json -Compress
          $before = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "ce-before.json")
          if ($current -ne $before) { throw "CE state changed during connection operations" }

      - name: Run official CE authorized blocked invalid and prewrite integration
        run: pytest -q -m integration tests/test_ce_export_integration.py

      - name: Verify CE unchanged after export operations
        shell: pwsh
        run: |
          $ce = $env:EV4_CE_REPO
          $current = [ordered]@{
            head = (git -C $ce rev-parse HEAD)
            status = @(git -C $ce status --porcelain=v1 --untracked-files=all --ignored=matching)
            index = @(git -C $ce ls-files -s)
          } | ConvertTo-Json -Compress
          $before = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "ce-before.json")
          if ($current -ne $before) { throw "CE state changed during export operations" }

      - name: Run GUI workflow test
        run: pytest -q tests/test_gui_workflow.py

      - name: Run full Workbench suite
        run: pytest -q

      - name: Verify final CE state
        shell: pwsh
        run: |
          $ce = $env:EV4_CE_REPO
          $current = [ordered]@{
            head = (git -C $ce rev-parse HEAD)
            status = @(git -C $ce status --porcelain=v1 --untracked-files=all --ignored=matching)
            index = @(git -C $ce ls-files -s)
          } | ConvertTo-Json -Compress
          $before = Get-Content -Raw (Join-Path $env:RUNNER_TEMP "ce-before.json")
          if ($current -ne $before) { throw "CE dependency changed" }

      - name: Check patch whitespace
        run: git diff --check
